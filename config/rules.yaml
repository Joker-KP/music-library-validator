# Rules are deliberately non-destructive and apply to MP3 + FLAC unless specified.
library_root: /music
extensions: [.mp3, .flac]
# Albums are grouped by directory; recognized disc folders map to their parent.
# Examples: CD1, CD 02, Disc 1, Disk-2, Album - CD2 (case-insensitive).
# For names with totals, capture the disc: '^CD (?P<disc>\d+) of \d+$'.
# Matched names without a capture must contain exactly one positive number.
disc_folder_pattern: '^(?:.*[ _.-])?(?:cd|disc|disk)[ _.-]*0*(?P<disc>[1-9][0-9]*)$'

required_tags: [title, artist, album, tracknumber, albumartist, year]

artwork:
  required: true
  min_width: 500
  min_height: 500
  # No max file size imposed in baseline.

filename:
  # Characters allowed in the stem (without .mp3/.flac); '' or null allows all.
  # ASCII letter/digit ranges expand; brackets, parentheses and other punctuation are literal.
  allowed_chars: '[]0-9a-zA-Z -.()'
  # Uses an explicit two-digit track prefix; applies to file stem (no extension).
  regex: '^\d{2} - .+$'
  # Optional comparison against metadata; enable after tuning conventions.
  match_template: null   # e.g. '{tracknumber:02d} - {title}'

custom_rules:
  # Enable after confirming whether a release convention matches your collection.
  # Other conditions: {format: flac}, {is_compilation: true},
  # {field: origlyricist, is_present: true}, {field: title, contains: some-string}.
  # Combined selectors in one when mapping use AND logic.
  # - id: comment_lyricist
  #   when: {field: lyricist, is_present: true}
  #   field: comment
  #   template:
  #     operator: contains   # equals, regex (whole field), or contains
  #     pattern: 'słowa: {lyricist}'
  #   severity: warning
  - id: comment_has_composer
    when: {field: composer, is_present: true}
    field: comment
    template:
      operator: contains
      pattern: 'muzyka: {composer}'
    severity: warning
  - id: comment_has_lyricist
    when: {field: lyricist, is_present: true}
    field: comment
    template:
      operator: contains
      pattern: 'słowa: {lyricist}'
    severity: warning
  - id: comment_has_origlyricist
    when: {field: origlyricist, is_present: true}
    field: comment
    template:
      operator: contains
      pattern: 'oryg. słowa: {origlyricist}'
    severity: info
  - id: improper_flac_tag
    when:
      format: flac
      field: encodersettings
      is_present: true
    field: encodersettings
    template:
      operator: equals
      pattern: ''
    severity: info

album_rules:
  consistent_album: true
  consistent_albumartist: true
  unique_disc_track: true
  disc_number_mismatch: true
  consistent_artwork: true

# Compare copies of the same title/artist in different album directories.
# Missing credits differ from filled credits; surrounding whitespace is ignored.
cross_album_rules:
  enabled: true
  severity: warning
  # Normalized tag names to compare within each matched track group.
  fields: [composer, lyricist, origlyricist]
  # Names within each group are equivalent for this check only (case-sensitive).
  artist_alias_groups:
    - [Wolna Grupa Bukowina, Wojciech Bellon]
    - [U Pana Boga za Piecem, Sylwek Szweda, Towarzystwo Wzajemnej Adoracji]

# Opt in to full-track local decoding (fpcalc/libchromaprint-tools required).
# Set enabled: true to compare tags on copies matched by audio alone.
audio_identity_rules:
  enabled: true
  fields: [title, artist, composer]
  severity: warning
  matching:
    similarity_threshold: 0.70
    duration_tolerance_seconds: 3.0
    minimum_coverage: 0.80
