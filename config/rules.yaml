# Rules are deliberately non-destructive and apply to MP3 + FLAC unless specified.
library_root: /music
extensions: [.mp3, .flac]
# Albums are grouped by directory; recognized disc folders map to their parent.
# Examples: CD1, CD 02, Disc 1, Disk-2, Disc_03 (case-insensitive).
disc_folder_pattern: '^(?:cd|disc|disk)[ _.-]*0*[1-9][0-9]*$'
required_tags: [title, artist, album, tracknumber, comment]
artwork:
  required: true
  min_width: 500
  min_height: 500
  # No max file size imposed in baseline.
filename:
  # Uses an explicit two-digit track prefix; applies to file stem (no extension).
  regex: '^\d{2} - .+$'
  # Optional comparison against metadata; enable after tuning conventions.
  match_template: null   # e.g. '{tracknumber:02d} - {title}'
custom_rules:
  # Enable after confirming whether a release convention matches your collection.
  # - id: comment_artist_album
  #   field: comment
  #   equals_template: '{artist} - {album}'
  #   severity: warning
  []
album_rules:
  consistent_album: true
  consistent_albumartist: false
  unique_disc_track: true
  consistent_artwork: false
