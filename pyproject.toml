[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-library-validator"
version = "0.1.0"
description = "Read-only MP3/FLAC metadata and album convention auditor"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47,<2", "PyYAML>=6,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
music-validator = "music_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
